<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechSeed Archive | 最新論文×個人開発・SaaS応用アイデアDB</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-slate-900 text-white py-8 px-4 shadow-md">
    <div class="max-w-5xl mx-auto">
      <h1 class="text-2xl md:text-3xl font-bold tracking-tight">🌱 TechSeed Archive</h1>
      <p class="text-slate-300 mt-2 text-sm md:text-base">海外の最新研究・技術論文から「個人開発・マイクロSaaSの種」を毎日自動抽出するデータベース</p>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <!-- 検索＆タグフィルタ -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6">
      <input type="text" id="searchInput" placeholder="キーワードで検索（例：医療、画像解析、自動化、SaaS...）" 
             class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      <div id="tagContainer" class="flex flex-wrap gap-2 mt-3"></div>
    </div>

    <!-- 記事リスト -->
    <div id="archiveList" class="space-y-6"></div>
  </main>

  <script>
    const AMAZON_ASSOCIATE_TAG = "fgyssa-22"; // ★俺のAmazonアソシエイトID
    let allItems = [];
    let activeTag = null;

    async function loadArchive() {
      try {
        const res = await fetch('./data.json?t=' + new Date().getTime());
        allItems = await res.json();
        renderTags();
        renderList();
      } catch (e) {
        document.getElementById('archiveList').innerHTML = '<p class="text-slate-500">データがまだありません。</p>';
      }
    }

    function renderTags() {
      const tagSet = new Set();
      allItems.forEach(item => (item.tags || []).forEach(t => tagSet.add(t)));
      const container = document.getElementById('tagContainer');
      container.innerHTML = `<button onclick="filterByTag(null)" class="px-3 py-1 text-xs rounded-full font-medium ${!activeTag ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'}">すべて</button>`;
      tagSet.forEach(tag => {
        const active = activeTag === tag;
        container.innerHTML += `<button onclick="filterByTag('${tag}')" class="px-3 py-1 text-xs rounded-full font-medium ${active ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">#${tag}</button>`;
      });
    }

    function filterByTag(tag) {
      activeTag = tag;
      renderTags();
      renderList();
    }

    function renderList() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('archiveList');

      const filtered = allItems.filter(item => {
        const matchTag = !activeTag || (item.tags && item.tags.includes(activeTag));
        const textBlob = `${item.ja_title} ${item.original_title} ${item.problem} ${item.mechanism} ${JSON.stringify(item.saas_ideas)}`.toLowerCase();
        return matchTag && textBlob.includes(query);
      });

      container.innerHTML = filtered.map(item => {
        const amazonUrl = `https://www.amazon.co.jp/s?k=${encodeURIComponent(item.search_keyword || '機械学習 Python')}&tag=${AMAZON_ASSOCIATE_TAG}`;
        const ideasHtml = (item.saas_ideas || []).map((idea, i) => `
          <div class="bg-blue-50/60 border border-blue-100 rounded-lg p-4">
            <h4 class="font-bold text-blue-900 text-sm">💡 応用案${i + 1}: ${idea.idea_name}</h4>
            <p class="text-xs text-slate-600 mt-1"><strong>対象:</strong> ${idea.target_user}</p>
            <p class="text-xs text-slate-600 mt-1"><strong>MVP実装:</strong> ${idea.implementation}</p>
            <p class="text-xs text-blue-800 font-medium mt-1"><strong>収益化:</strong> ${idea.monetization}</p>
          </div>
        `).join('');

        return `
          <article class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
            <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-slate-400 mb-2">
              <span>公開日: ${item.published_date}</span>
              <div class="flex gap-1">
                ${(item.tags || []).map(t => `<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded">#${t}</span>`).join('')}
              </div>
            </div>
            <h2 class="text-xl font-bold text-slate-900 mb-1">${item.ja_title}</h2>
            <p class="text-xs text-slate-400 mb-4"><a href="${item.url}" target="_blank" rel="noopener" class="underline hover:text-blue-600">原著: ${item.original_title} ↗</a></p>

            <div class="space-y-3 text-sm leading-relaxed">
              <div><span class="font-bold text-rose-600">■ 従来の課題：</span>${item.problem}</div>
              <div><span class="font-bold text-emerald-700">■ コア技術の仕組み：</span>${item.mechanism}</div>
              <div><span class="font-bold text-amber-600">■ ブレイクスルー：</span>${item.key_advantage}</div>
            </div>

            <div class="mt-5 grid md:grid-cols-2 gap-3">
              ${ideasHtml}
            </div>

            <div class="mt-5 pt-4 border-t border-slate-100 flex justify-between items-center text-xs">
              <span class="text-slate-500">関連トピック: ${item.search_keyword}</span>
              <a href="${amazonUrl}" target="_blank" rel="noopener" class="bg-amber-500 hover:bg-amber-600 text-white font-semibold px-3 py-1.5 rounded-lg transition">
                📚 関連する専門書をAmazonで探す
              </a>
            </div>
          </article>
        `;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', renderList);
    loadArchive();
  </script>
</body>
</html>
